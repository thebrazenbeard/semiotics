[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semiotics"
version = "0.1.0"
description = "Contextual sign interpretation with explicit provenance and competing readings"
requires-python = ">=3.10"
license = {text = "Source-visible proprietary; see LICENSE"}

[project.scripts]
semiotics = "semiotics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
